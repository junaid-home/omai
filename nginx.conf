map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Match the project ZIP limit enforced by the UI and API (200 MiB).
    client_max_body_size 200m;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy all API requests to the backend server. Must come before the static
    # asset cache location: regex locations win on first match, and proxied
    # preview paths (e.g. /global/preview/proxy/<port>/.../app.js) end in asset
    # extensions that would otherwise be served (404) from disk instead.
    #
    # Every top-level path segment served by RootHttpApi must appear here. A
    # missing segment is not a 404: it falls through to the SPA fallback below
    # and returns index.html with Content-Type: text/html, so the client fails
    # with "Unexpected token '<'" instead of a usable API error. Keep in sync
    # when adding an API group.
    location ~ ^/(global|session|file|project(?!s)|provider|path|config|question|permission|pty|mcp|sync|tui|preview|auth|admin|api|agent|command|doc|event|experimental|find|formatter|git|instance|log|lsp|skill|vcs|publish|user-state)($|/) {
        proxy_pass http://127.0.0.1:4096;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Use x-forwarded-proto from upstream proxy (Cloudflare) if available,
        # otherwise fall back to $scheme.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# The preview origin owns a separate listener (OPENCODE_PREVIEW_PORT, default
# 4097) that serves only /static/<id>/... and /global/preview/proxy/<port>/...
# It must be matched by Host rather than path: routing preview requests to the
# API listener above never reaches the ticket exchange or the dev-server proxy,
# and /static/... would otherwise fall through to the SPA fallback and return
# index.html with Content-Type: text/html.
server {
    listen 80;
    server_name preview.localhost preview.omai.local;

    location / {
        proxy_pass http://127.0.0.1:4097;
        # Must stay $http_host: the preview listener rejects any request whose
        # Host is not exactly the preview origin, port included.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
