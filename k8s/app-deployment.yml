apiVersion: apps/v1
kind: Deployment
metadata:
  name: omai-app
  namespace: omai
  labels:
    app: omai-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omai-app
  template:
    metadata:
      labels:
        app: omai-app
    spec:
      containers:
        - name: omai-app
          image: jj123dev/omai-app:pgsql
          imagePullPolicy: Always
          ports:
            - containerPort: 80
            - containerPort: 443
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: nginx-tls
              mountPath: /etc/nginx/ssl
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: omai-nginx-config
        - name: nginx-tls
          secret:
            secretName: omai-app-tls
---
apiVersion: v1
kind: Service
metadata:
  name: omai-app
  namespace: omai
  labels:
    app: omai-app
  annotations:
    load-balancer.hetzner.cloud/location: nbg1
spec:
  type: LoadBalancer
  selector:
    app: omai-app
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
