# Instance-scoped secrets for central mode.
#
# These are committed plaintext, like k8s/secret-storage.yml and
# k8s/secret-cloudflare.yml. That is a standing exposure risk: anyone with read
# access to this repository can mint valid session cookies for the deployment.
# Moving them to GitHub Actions secrets or an external secret store is the fix,
# but that is a separate change from making the deploy work.
#
# OPENCODE_DATA_KEY is the most dangerous of the three. It encrypts persisted
# instance state on the central storage volume. Rotating it without re-encrypting
# existing state makes that state unreadable, so treat it as append-only.
apiVersion: v1
kind: Secret
metadata:
  name: omai-instance-secrets
  namespace: omai
type: Opaque
stringData:
  # Must be at least 32 bytes. packages/opencode/src/auth/jwt.ts:21
  OPENCODE_JWT_SECRET: "IV4tOQbrtcaN6GJEHM8U3dWorpK1gK0pk4g7aiKUMVwPmSin9yTcoTTsB8CDjbyh"
  # Gates the registration endpoint. handlers/auth.ts:37
  OPENCODE_REGISTRATION_SECRET: "DAMkmP2J18Bs7Lz0mlVPGoFXxzOA6N2mRhbfIOAmA6esIGdJ+T7YYLYw8R6Zu9+1"
  # Canonical base64 32-byte key. packages/core/src/instance-state/encryption.ts:13
  OPENCODE_DATA_KEY: "mthbEu626PCMGb6umNFCfVLXG/8cp7eZ37XubJWMRMM="
  # Google OAuth "Continue with Google" credentials. Both must be set for the
  # flow to work; the login button is always visible. handlers/auth.ts
  # googleCredentials()
  OPENCODE_GOOGLE_CLIENT_ID: "443944139948-ukr33cu6od3i0vbntkif9tnf0dflm9gt.apps.googleusercontent.com"
  OPENCODE_GOOGLE_CLIENT_SECRET: "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"
---
apiVersion: v1
kind: Secret
metadata:
  name: omai-postgres-credentials
  namespace: omai
type: Opaque
stringData:
  # Hex, not base64: these passwords appear inside a postgresql:// URL and
  # base64 "+" and "/" would need percent-encoding to survive the connection
  # string parser.
  POSTGRES_SUPERUSER_PASSWORD: "bca155dbe8d83e376cf28e452852bde23c8227738158d0bd"
  MIGRATOR_PASSWORD: "c7a16d570cf287549f1a8affa684b0e0e5697f00b388e4d3"
  RUNTIME_PASSWORD: "40b35f255ad2816a55b5099c2ffe0ef7931d8775d4ff1879"
  DATABASE: "omai"
