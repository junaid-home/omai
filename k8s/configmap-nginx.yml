apiVersion: v1
kind: ConfigMap
metadata:
  name: omai-nginx-config
  namespace: omai
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Match the project ZIP limit enforced by the UI and API (200 MiB).
        client_max_body_size 200m;

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        location ~ ^/(global|session|file|project(?!s)|provider|path|config|question|permission|pty|mcp|sync|tui|preview|auth|api|agent|command|doc|event|experimental|find|formatter|git|instance|log|lsp|skill|vcs|publish|user-state)($|/) {
            proxy_pass http://omai-opencode.omai.svc.cluster.local:4096;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # The preview origin owns its own listener (OPENCODE_PREVIEW_PORT). That
    # listener serves only /static/<id>/... and /global/preview/proxy/<port>/...,
    # so this host must be proxied wholesale: routing it through the 4096 API
    # server 401s every embed and falls through to the SPA, and neither the
    # ticket exchange nor the dev-server proxy can run.
    #
    # preview.omai.ch must resolve to this LoadBalancer in Cloudflare DNS. The
    # hostname must differ from the app host or preview/http.ts:29 refuses to
    # start the listener.
    #
    # Cloudflare's edge certificate for this zone covers *.omai.ch only, so a
    # sub-subdomain such as preview.app.omai.ch fails the TLS handshake with
    # ERR_SSL_VERSION_OR_CIPHER_MISMATCH. One level of subdomain is required.
    server {
        listen 80;
        server_name preview.omai.ch;

        location / {
            proxy_pass http://omai-opencode.omai.svc.cluster.local:4097;
            # Must stay $http_host: the preview listener rejects any request whose
            # Host is not exactly the preview origin.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_cache off;
            # Dev-server streams and long-lived HMR websockets must not be cut.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
