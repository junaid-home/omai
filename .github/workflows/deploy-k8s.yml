name: Build and push Docker images

on:
  push:
    branches: [dev, feature/microvm]
    paths:
      - "Dockerfile.*"
      - "entrypoint.sh"
      - "package.json"
      - "packages/**"
      - ".github/workflows/deploy-k8s.yml"
  workflow_dispatch:
    inputs:
      bust_cache:
        description: "Bust Docker build cache"
        required: false
        type: boolean
        default: false

jobs:
  build:
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set cache scope
        id: cache
        run: |
          if [ "${{ inputs.bust_cache }}" = "true" ]; then
            echo "scope=bust-$(date +%s)" >> $GITHUB_OUTPUT
          else
            echo "scope=stable" >> $GITHUB_OUTPUT
          fi

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.controlplane
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/omai-opencode:pgsql
          provenance: false
          # entrypoint.sh bakes --cors origins from these at build time, so an
          # omitted ARG silently produces the literal origins "http://" and
          # "http://:". Keep them in sync with OPENCODE_HOST and
          # OPENCODE_FRONTEND_PORT in k8s/opencode-deployment.yml.
          build-args: |
            OPENCODE_HOST=omai-app.omai.svc.cluster.local
            OPENCODE_SERVER_PORT=4096
          cache-from: type=gha,scope=backend-${{ steps.cache.outputs.scope }}
          cache-to: type=gha,scope=backend-${{ steps.cache.outputs.scope }},mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.app
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/omai-app:pgsql
          provenance: false
          build-args: |
            VITE_OPENCODE_SERVER_HOST=
            VITE_OPENCODE_SERVER_PORT=80
            VITE_OPENCODE_SERVER_PROTOCOL=http
          cache-from: type=gha,scope=frontend-${{ steps.cache.outputs.scope }}
          cache-to: type=gha,scope=frontend-${{ steps.cache.outputs.scope }},mode=max

  vm:
    if: github.ref_name == 'feature/microvm'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Northflank MicroVMs report infrastructure.architecture "x86", so the
      # image must be linux/amd64. An arm64 image fails at exec with
      # "Exec format error (os error 8)" and crash-loops. The runner is amd64,
      # so this build is native (no QEMU) — faster than the old arm64 target.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set cache scope
        id: cache
        run: |
          if [ "${{ inputs.bust_cache }}" = "true" ]; then
            echo "scope=vm-bust-$(date +%s)" >> $GITHUB_OUTPUT
          else
            echo "scope=vm" >> $GITHUB_OUTPUT
          fi

      - name: Build and push microVM image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.microvm
          push: true
          platforms: linux/amd64
          tags: jj123dev/microvm:latest
          provenance: false
          # No build-args: the VM entrypoint resolves OPENCODE_HOST at runtime,
          # matching the manual `docker build -f Dockerfile.microvm` flow.
          cache-from: type=gha,scope=microvm-${{ steps.cache.outputs.scope }}
          cache-to: type=gha,scope=microvm-${{ steps.cache.outputs.scope }},mode=max

      - name: Build and push control plane image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.controlplane
          push: true
          platforms: linux/amd64
          tags: jj123dev/controlplane:latest
          provenance: false
          cache-from: type=gha,scope=controlplane-${{ steps.cache.outputs.scope }}
          cache-to: type=gha,scope=controlplane-${{ steps.cache.outputs.scope }},mode=max
