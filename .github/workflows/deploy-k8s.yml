name: Build and push Docker images

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Which image to build and push"
        required: true
        type: choice
        options:
          - controlplane
          - microvm
          - web
          - all
        default: all
      bust_cache:
        description: "Bust Docker build cache"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-controlplane:
    if: ${{ github.event.inputs.image == 'controlplane' || github.event.inputs.image == 'all' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set cache scope
        id: cache
        run: |
          if [ "${{ inputs.bust_cache }}" = "true" ]; then
            echo "scope=bust-$(date +%s)" >> $GITHUB_OUTPUT
          else
            echo "scope=stable" >> $GITHUB_OUTPUT
          fi

      - name: Build and push control plane image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.controlplane
          push: true
          platforms: linux/amd64
          tags: jj123dev/controlplane:latest
          provenance: false
          cache-from: type=gha,scope=controlplane-${{ steps.cache.outputs.scope }}
          cache-to: type=gha,scope=controlplane-${{ steps.cache.outputs.scope }},mode=max

  build-microvm:
    if: ${{ github.event.inputs.image == 'microvm' || github.event.inputs.image == 'all' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set cache scope
        id: cache
        run: |
          if [ "${{ inputs.bust_cache }}" = "true" ]; then
            echo "scope=bust-$(date +%s)" >> $GITHUB_OUTPUT
          else
            echo "scope=vm" >> $GITHUB_OUTPUT
          fi

      - name: Build and push microVM image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.microvm
          push: true
          platforms: linux/amd64
          tags: jj123dev/microvm:latest
          provenance: false
          cache-from: type=gha,scope=microvm-${{ steps.cache.outputs.scope }}
          cache-to: type=gha,scope=microvm-${{ steps.cache.outputs.scope }},mode=max

  build-web:
    if: ${{ github.event.inputs.image == 'web' || github.event.inputs.image == 'all' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set cache scope
        id: cache
        run: |
          if [ "${{ inputs.bust_cache }}" = "true" ]; then
            echo "scope=bust-$(date +%s)" >> $GITHUB_OUTPUT
          else
            echo "scope=stable" >> $GITHUB_OUTPUT
          fi

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.app
          push: true
          platforms: linux/amd64
          tags: jj123dev/web:latest
          provenance: false
          build-args: |
            VITE_OPENCODE_SERVER_HOST=
            VITE_OPENCODE_SERVER_PORT=80
            VITE_OPENCODE_SERVER_PROTOCOL=http
          cache-from: type=gha,scope=frontend-${{ steps.cache.outputs.scope }}
          cache-to: type=gha,scope=frontend-${{ steps.cache.outputs.scope }},mode=max
